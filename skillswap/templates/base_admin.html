<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Admin Panel - SkillSwap{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="d-flex">
  <div class="bg-dark text-white p-3 vh-100" style="width:250px; position:sticky; top:0; min-height:100vh;">
    <h4 class="text-white">Admin Panel</h4>
    <hr class="text-white">
    <a href="{% url 'admin_dashboard' %}" class="d-block text-white mb-2 text-decoration-none {% block side_dashboard %}{% endblock %}">Dashboard</a>
    <a href="{% url 'admin_users' %}" class="d-block text-white mb-2 text-decoration-none {% block side_users %}{% endblock %}">Users</a>
    <a href="{% url 'admin_skills' %}" class="d-block text-white mb-2 text-decoration-none {% block side_skills %}{% endblock %}">Skills</a>
    <a href="{% url 'admin_requests' %}" class="d-block text-white mb-2 text-decoration-none {% block side_requests %}{% endblock %}">Swap Requests</a>
    <a href="{% url 'admin_reports' %}" class="d-block text-white mb-2 text-decoration-none {% block side_reports %}{% endblock %}">Reports</a>
    <hr class="text-white">
    <a href="{% url 'logout' %}" class="d-block text-danger text-decoration-none">Logout</a>
  </div>

  <div class="flex-grow-1">
    <nav class="navbar navbar-light bg-light shadow-sm px-3">
      <span class="navbar-brand fw-bold">{% block page_title %}Admin Dashboard{% endblock %}</span>
      <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm">Logout</a>
    </nav>

    {% if messages %}
    <div class="container mt-2">
      {% for msg in messages %}
      <div class="alert alert-{% if msg.tags == 'error' %}danger{% else %}{{ msg.tags }}{% endif %} alert-dismissible fade show">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      {% endfor %}
    </div>
    {% endif %}

    <div class="container mt-4">
      {% block content %}{% endblock %}
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
