<!DOCTYPE html>
<html lang="en">
<head>
  <title>Login - SkillSwap</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="/">SkillSwap</a>
  </div>
</nav>

{% if messages %}
<div class="container mt-2">
  {% for msg in messages %}
  <div class="alert alert-{% if msg.tags == 'error' %}danger{% else %}{{ msg.tags }}{% endif %} alert-dismissible fade show">
    {{ msg }}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  {% endfor %}
</div>
{% endif %}

<div class="container">
  <div class="row justify-content-center mt-4">
    <div class="col-md-4">
      <div class="card shadow p-4">
        <h3 class="text-center mb-3">Login</h3>
        <form method="post">
          {% csrf_token %}
          {{ form.username }}
          {{ form.password }}
          <button type="submit" name="login_user" class="btn btn-success w-100 mb-2">Login as User</button>
        </form>
        <hr>
        <form method="post">
          {% csrf_token %}
          <input name="username" class="form-control mb-2" placeholder="Admin username">
          <input type="password" name="password" class="form-control mb-2" placeholder="Admin password">
          <input type="hidden" name="login_admin" value="1">
          <button type="submit" class="btn btn-dark w-100">Login as Admin</button>
        </form>
        <p class="text-center mt-3 mb-0">
          Don't have an account? <a href="{% url 'signup' %}">Sign up</a>
        </p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
