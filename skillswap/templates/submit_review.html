{% extends 'base.html' %}
{% block title %}Review {{ reviewed_user.username }} - SkillSwap{% endblock %}

{% block content %}
<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow border-0 p-4 text-center">
        <h4>Rating &amp; Review</h4>
        <p class="text-muted">User: <strong>{{ reviewed_user.get_full_name|default:reviewed_user.username }}</strong></p>
        <form method="post">
          {% csrf_token %}
          <label class="form-label">Rating</label>
          {{ form.rating }}
          <label class="form-label">Write Review</label>
          {{ form.comment }}
          <button type="submit" class="btn btn-primary w-100 mt-2">Submit</button>
        </form>
        <a href="{% url 'reviews' %}" class="btn btn-outline-secondary mt-2">Cancel</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
