<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Admin Panel - SkillSwap{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background: #f1f5f9; }

    .admin-sidebar {
      width: 260px;
      min-height: 100vh;
      background: linear-gradient(180deg, #1e1b4b 0%, #312e81 60%, #4338ca 100%);
      position: sticky;
      top: 0;
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
    }

    .admin-sidebar .brand {
      font-size: 1.3rem;
      font-weight: 800;
      background: linear-gradient(90deg, #a5b4fc, #67e8f9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }

    .admin-sidebar .brand-sub {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 28px;
    }

    .admin-sidebar hr { border-color: rgba(255,255,255,0.15); }

    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 500;
      font-size: 0.92rem;
      margin-bottom: 4px;
      transition: all 0.2s ease;
    }

    .sidebar-link:hover, .sidebar-link.active {
      background: rgba(255,255,255,0.15);
      color: #fff;
    }

    .sidebar-link.logout-link {
      color: #fca5a5;
      margin-top: auto;
    }

    .sidebar-link.logout-link:hover { background: rgba(239,68,68,0.2); color: #fca5a5; }

    .admin-topbar {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 1px 8px rgba(0,0,0,0.05);
    }

    .admin-topbar .page-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #1e1b4b;
    }

    .admin-content { padding: 28px; }

    .card {
      border: none;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }

    .card-header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      border-radius: 16px 16px 0 0 !important;
      font-weight: 600;
      padding: 14px 20px;
      border: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border: none; border-radius: 10px; font-weight: 600;
    }

    .btn-danger { border-radius: 10px; font-weight: 600; }
    .btn-success { border-radius: 10px; font-weight: 600; }

    .table thead th {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white; border: none; font-weight: 600;
    }

    .alert { border-radius: 12px; border: none; font-weight: 500; }

    .stat-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .stat-icon {
      width: 56px; height: 56px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem;
    }

    .stat-icon.purple { background: linear-gradient(135deg, #ede9fe, #ddd6fe); color: #7c3aed; }
    .stat-icon.blue { background: linear-gradient(135deg, #dbeafe, #bfdbfe); color: #2563eb; }
    .stat-icon.green { background: linear-gradient(135deg, #d1fae5, #a7f3d0); color: #059669; }
    .stat-icon.orange { background: linear-gradient(135deg, #fef3c7, #fde68a); color: #d97706; }

    .stat-value { font-size: 1.8rem; font-weight: 800; color: #1e1b4b; line-height: 1; }
    .stat-label { font-size: 0.82rem; color: #6b7280; font-weight: 500; margin-top: 4px; }
  </style>
</head>
<body>

<div class="d-flex">
  <div class="admin-sidebar">
    <div class="brand">⚡ SkillSwap</div>
    <div class="brand-sub">Admin Panel</div>
    <hr>
    <a href="{% url 'admin_dashboard' %}" class="sidebar-link {% block side_dashboard %}{% endblock %}">
      <i class="bi bi-speedometer2"></i> Dashboard
    </a>
    <a href="{% url 'admin_users' %}" class="sidebar-link {% block side_users %}{% endblock %}">
      <i class="bi bi-people"></i> Users
    </a>
    <a href="{% url 'admin_skills' %}" class="sidebar-link {% block side_skills %}{% endblock %}">
      <i class="bi bi-lightbulb"></i> Skills
    </a>
    <a href="{% url 'admin_requests' %}" class="sidebar-link {% block side_requests %}{% endblock %}">
      <i class="bi bi-arrow-left-right"></i> Swap Requests
    </a>
    <a href="{% url 'admin_reports' %}" class="sidebar-link {% block side_reports %}{% endblock %}">
      <i class="bi bi-bar-chart"></i> Reports
    </a>
    <hr>
    <a href="{% url 'logout' %}" class="sidebar-link logout-link">
      <i class="bi bi-box-arrow-right"></i> Logout
    </a>
  </div>

  <div class="flex-grow-1">
    <div class="admin-topbar">
      <span class="page-title">{% block page_title %}Admin Dashboard{% endblock %}</span>
      <div class="d-flex align-items-center gap-3">
        <span class="badge bg-danger">Admin</span>
        <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm">
          <i class="bi bi-box-arrow-right me-1"></i>Logout
        </a>
      </div>
    </div>

    {% if messages %}
    <div class="px-4 mt-3">
      {% for msg in messages %}
      <div class="alert alert-{% if msg.tags == 'error' %}danger{% else %}{{ msg.tags }}{% endif %} alert-dismissible fade show">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      {% endfor %}
    </div>
    {% endif %}

    <div class="admin-content">
      {% block content %}{% endblock %}
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
