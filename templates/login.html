<!DOCTYPE html>
<html lang="en">
<head>
  <title>Login - SkillSwap</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 40%, #4f46e5 70%, #06b6d4 100%);
      display: flex;
      flex-direction: column;
    }

    .login-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }

    .login-card {
      background: rgba(255,255,255,0.97);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 44px 40px;
      width: 100%;
      max-width: 420px;
    }

    .logo-area {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-icon {
      width: 60px; height: 60px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      margin-bottom: 12px;
    }

    .logo-area h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #1e1b4b;
      margin: 0;
    }

    .logo-area p {
      color: #6b7280;
      font-size: 0.9rem;
      margin-top: 4px;
    }

    /* TAB SWITCHER */
    .tab-switcher {
      display: flex;
      background: #f1f5f9;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      border-radius: 9px;
      font-weight: 600;
      font-size: 0.9rem;
      color: #6b7280;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .tab-btn.active {
      background: white;
      color: #4f46e5;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .tab-btn.admin-tab.active {
      color: #1e1b4b;
    }

    /* FORM PANELS */
    .form-panel { display: none; }
    .form-panel.active { display: block; }

    .form-control {
      border-radius: 10px;
      border: 1.5px solid #e5e7eb;
      padding: 10px 14px;
      font-size: 0.93rem;
      margin-bottom: 12px;
    }

    .form-control:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79,70,229,0.15);
    }

    .btn-user {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      padding: 11px;
      width: 100%;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .btn-user:hover {
      background: linear-gradient(135deg, #4338ca, #6d28d9);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(79,70,229,0.35);
      color: white;
    }

    .btn-admin {
      background: linear-gradient(135deg, #1e1b4b, #312e81);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      padding: 11px;
      width: 100%;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .btn-admin:hover {
      background: linear-gradient(135deg, #312e81, #4338ca);
      transform: translateY(-1px);
      color: white;
    }

    .signup-link {
      text-align: center;
      margin-top: 20px;
      font-size: 0.9rem;
      color: #6b7280;
    }

    .signup-link a {
      color: #4f46e5;
      font-weight: 600;
      text-decoration: none;
    }

    .signup-link a:hover { text-decoration: underline; }
    .alert { border-radius: 12px; border: none; font-size: 0.9rem; }
  </style>
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">

    <div class="logo-area">
      <div class="logo-icon">⚡</div>
      <h1>SkillSwap</h1>
      <p>Sign in to start swapping skills</p>
    </div>

    {% if messages %}
      {% for msg in messages %}
      <div class="alert alert-{% if msg.tags == 'error' %}danger{% else %}{{ msg.tags }}{% endif %} alert-dismissible fade show mb-3">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      {% endfor %}
    {% endif %}

    <!-- TAB SWITCHER -->
    <div class="tab-switcher">
      <button class="tab-btn active" onclick="switchTab('user')">
        <i class="bi bi-person"></i> User Login
      </button>
      <button class="tab-btn admin-tab" onclick="switchTab('admin')">
        <i class="bi bi-shield"></i> Admin Login
      </button>
    </div>

    <!-- USER LOGIN PANEL -->
    <div class="form-panel active" id="panel-user">
      <form method="post">
        {% csrf_token %}
        <input name="username" class="form-control" placeholder="Username" required>
        <input type="password" name="password" class="form-control" placeholder="Password" required>
        <button type="submit" name="login_user" class="btn-user">
          <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>
      </form>
      <div class="signup-link">
        Don't have an account? <a href="{% url 'signup' %}">Create one</a>
      </div>
    </div>

    <!-- ADMIN LOGIN PANEL -->
    <div class="form-panel" id="panel-admin">
      <form method="post">
        {% csrf_token %}
        <input name="username" class="form-control" placeholder="Admin username" required>
        <input type="password" name="password" class="form-control" placeholder="Admin password" required>
        <input type="hidden" name="login_admin" value="1">
        <button type="submit" class="btn-admin">
          <i class="bi bi-shield-lock me-2"></i>Login as Admin
        </button>
      </form>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.form-panel').forEach(panel => panel.classList.remove('active'));
    document.getElementById('panel-' + tab).classList.add('active');
    event.currentTarget.classList.add('active');
  }
</script>
</body>
</html>
